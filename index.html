<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Blast - Puzzle Oyunu</title>
    <meta name="description" content="Block Blast benzeri puzzle oyunu - blokları yerleştir, satır ve sütunları tamamla!">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: #e94560;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        .score-board {
            display: flex;
            gap: 30px;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .score-value {
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .cell.filled {
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3);
        }

        .cell.clearing {
            animation: clear-animation 0.3s ease;
        }

        @keyframes clear-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .pieces-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            min-height: 120px;
        }

        .piece {
            cursor: grab;
            transition: transform 0.2s ease;
        }

        .piece:hover {
            transform: scale(1.1);
        }

        .piece.dragging {
            cursor: grabbing;
            opacity: 0.8;
            transform: scale(1.2);
        }

        .piece-grid {
            display: grid;
            gap: 2px;
        }

        .piece-cell {
            width: 25px;
            height: 25px;
            border-radius: 3px;
        }

        .piece.empty {
            opacity: 0;
            pointer-events: none;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-over.hidden {
            display: none;
        }

        .game-over h2 {
            color: #e94560;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .game-over p {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        @media (max-width: 600px) {
            .cell {
                width: 35px;
                height: 35px;
            }

            .piece-cell {
                width: 20px;
                height: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .score-value {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .cell {
                width: 30px;
                height: 30px;
            }

            .piece-cell {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Block Blast</h1>
        
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Skor</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">En Yüksek</div>
                <div class="score-value" id="high-score">0</div>
            </div>
        </div>

        <div class="game-board" id="game-board"></div>

        <div class="pieces-container" id="pieces-container"></div>
    </div>

    <div class="game-over hidden" id="game-over">
        <h2>Oyun Bitti!</h2>
        <p>Skorunuz: <span id="final-score">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Yeniden Başla</button>
    </div>

    <script src="game.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(registration => console.log('Service Worker registered'))
                .catch(error => console.log('Service Worker registration failed'));
        }
    </script>
</body>
</html>
